<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Grand Cinema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-left">
            <span class="brand-logo">THE GRAND CINEMA</span>
            <div class="location-selector">
                <select id="cinema-location">
                    <option value="dunedin">Dunedin</option>
                    <option value="auckland">LynnMall (Auckland)</option>
                    <option value="wellington">Courtenay Central (Wellington)</option>
                    <option value="christchurch">The Palms (Christchurch)</option>
                    <option value="invercargill">Invercargill</option>
                    <option value="rotorua">Rotorua</option>
                    <option value="napier">Napier</option>
                </select>
            </div>
        </div>

        <div class="nav-buttons">
            <a href="#movies" class="btn" id="nav-movies">Movies</a>
            <a href="#rewards" class="btn" id="nav-rewards">Rewards</a>
            <a href="#giftshop" class="btn" id="nav-giftshop">Gift Shop</a>
        </div>

        <div class="header-right">
            <a href="#login" class="login-link">LOGIN / SIGN UP</a>
        </div>
    </header>

    <div class="poster-gap-placeholder"></div>

    <nav class="sub-nav-bar">
        <div class="sub-nav-buttons">
            <a href="#movies" class="sub-btn" id="sub-nav-showing">Now Showing</a>
            <a href="#coming-soon" class="sub-btn" id="sub-nav-coming">Coming Soon</a>
            <a href="#food-beverage" class="sub-btn" id="sub-nav-food">Food & Beverage</a>
        </div>
    </nav>

    <div class="page" id="movies">
        <h2>Now Showing</h2>
        <p>Movie 1 - 12:00 PM</p>
        <p>Movie 2 - 3:30 PM</p>
        <p>Movie 3 - 7:00 PM</p>
    </div>

    <div class="page" id="rewards"></div>

    <div class="page" id="giftshop"></div>

    <div class="page" id="coming-soon"></div>

    <div class="page" id="food-beverage"></div>

</body>
</html>
