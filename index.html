<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Theatre</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="nav-buttons">
            <a href="#home" class="btn" id="nav-home">Home</a>
            <a href="#movies" class="btn" id="nav-movies">Now Showing</a>
            <a href="#tickets" class="btn" id="nav-tickets">Book Tickets</a>
        </div>
    </header>

    <div class="page" id="movies">
        <h2>Now Showing</h2>
        <p>Movie 1 - 12:00 PM</p>
        <p>Movie 2 - 3:30 PM</p>
        <p>Movie 3 - 7:00 PM</p>
        <a href="#home" class="back-link">Go Back</a>
    </div>

    <div class="page" id="tickets">
        <h2>Book Your Tickets</h2>
        <p>Ticket booking form or information goes here.</p>
        <a href="#home" class="back-link">Go Back</a>
    </div>

    <div class="page" id="home">
        <h1>Welcome to the Theatre</h1>
        <p>Your main home screen content goes here.</p>
    </div>

</body>
</html>
